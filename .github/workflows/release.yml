# Publishes a GitHub release with the .mcaddon / .mcpack downloads for a version tag (v*).
# Works both when a tag is pushed and when a release is published on the website: in that case it just
# attaches the files. Release notes come from docs/releases/<tag>.md if it exists, otherwise the matching section of
# CHANGELOG.md (a release made on the website with an empty description gets them). 0.x versions are pre-releases.
name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the packs
        run: python3 tools/validate.py

      - name: Name the downloads
        run: |
          V="${{ github.event.release.tag_name || github.ref_name }}"
          mkdir -p out
          cp dist/BlackClover_GrimoireAwakening.mcaddon "out/BlackClover_GrimoireAwakening_${V}.mcaddon"
          cp dist/BlackClover_BP.mcpack "out/BlackClover_BP_${V}.mcpack"
          cp dist/BlackClover_RP.mcpack "out/BlackClover_RP_${V}.mcpack"
          # hand-written release notes win; otherwise the matching section of the changelog
          if [ -f "docs/releases/${V}.md" ]; then cp "docs/releases/${V}.md" notes.md
          else awk -v v="## ${V}" 'index($0, "## ") == 1 { p = (index($0, v) == 1) } p' CHANGELOG.md > notes.md; fi
          test -s notes.md || echo "Black Clover: Grimoire Awakening ${V}" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          PRE=""
          case "$TAG" in v0.*|*-*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            # a release made on the website with an empty description gets the changelog and the right labels
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md --title "Black Clover: Grimoire Awakening ${TAG}" $PRE
            fi
          else
            gh release create "$TAG" out/* --title "Black Clover: Grimoire Awakening ${TAG}" --notes-file notes.md $PRE
          fi
